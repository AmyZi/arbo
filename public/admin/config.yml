backend:
  name: github
  # Replace with your actual GitHub "owner/repo" — e.g. arbo-ab/growth101-landing
  repo: AmyZi/arbo
  branch: main
  # Points Decap at the OAuth proxy defined in app/api/auth and app/api/callback.
  base_url: https://arboweb.com
  auth_endpoint: api/auth

# Every publish creates a commit directly on `branch` above. Flip this on
# if you'd rather review a PR (via Decap's "Editorial Workflow") before
# it goes live — recommended once more than one person is posting.
publish_mode: simple

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "Growth101" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Tags", name: "tags", widget: "list", default: ["Marketing"] }
      - { label: "Body", name: "body", widget: "markdown" }